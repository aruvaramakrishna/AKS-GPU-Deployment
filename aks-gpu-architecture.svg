<svg width="700" height="640" viewBox="0 0 700 640" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="13">

  <!-- Background -->
  <rect width="700" height="640" fill="#0d1117" rx="12"/>

  <!-- ACR Box (Blue) -->
  <rect x="20" y="40" width="150" height="56" rx="8" fill="#0c447c" stroke="#378ADD" stroke-width="1"/>
  <text x="95" y="63" text-anchor="middle" fill="#85B7EB" font-weight="600" font-size="12">Container Registry</text>
  <text x="95" y="82" text-anchor="middle" fill="#378ADD" font-size="11">ACR — stores images</text>

  <!-- Arrow ACR → Cluster -->
  <line x1="170" y1="68" x2="208" y2="68" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- AKS Cluster outer box (Teal) -->
  <rect x="210" y="14" width="468" height="608" rx="16" fill="#04342C" stroke="#1D9E75" stroke-width="1"/>
  <text x="444" y="38" text-anchor="middle" fill="#5DCAA5" font-weight="700" font-size="14">AKS Cluster</text>

  <!-- Control Plane (Gray) -->
  <rect x="228" y="48" width="432" height="44" rx="8" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="1"/>
  <text x="444" y="66" text-anchor="middle" fill="#D3D1C7" font-weight="600" font-size="12">Control Plane (Managed)</text>
  <text x="444" y="83" text-anchor="middle" fill="#888780" font-size="11">API Server · etcd · Scheduler · Controller Manager</text>

  <!-- Arrow Control Plane → Node Pools -->
  <line x1="444" y1="92" x2="444" y2="112" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arr-teal)"/>

  <!-- CPU Node Pool (Gray) -->
  <rect x="228" y="114" width="190" height="54" rx="8" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="1"/>
  <text x="323" y="136" text-anchor="middle" fill="#D3D1C7" font-weight="600" font-size="12">CPU Node Pool</text>
  <text x="323" y="155" text-anchor="middle" fill="#888780" font-size="11">System pods, ingress</text>

  <!-- GPU Node Pool (Amber) -->
  <rect x="448" y="114" width="192" height="54" rx="8" fill="#412402" stroke="#BA7517" stroke-width="1"/>
  <text x="544" y="136" text-anchor="middle" fill="#FAC775" font-weight="600" font-size="12">GPU Node Pool</text>
  <text x="544" y="155" text-anchor="middle" fill="#BA7517" font-size="11">NC/ND-series VMs (NVIDIA)</text>

  <!-- Arrow GPU Node → NVIDIA Plugin -->
  <line x1="544" y1="168" x2="544" y2="198" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arr-amber)"/>

  <!-- NVIDIA Device Plugin (Amber) -->
  <rect x="448" y="200" width="192" height="54" rx="8" fill="#412402" stroke="#BA7517" stroke-width="1"/>
  <text x="544" y="222" text-anchor="middle" fill="#FAC775" font-weight="600" font-size="12">NVIDIA Device Plugin</text>
  <text x="544" y="241" text-anchor="middle" fill="#BA7517" font-size="11">DaemonSet — exposes GPUs</text>

  <!-- Arrows into namespace -->
  <line x1="444" y1="254" x2="444" y2="282" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <line x1="544" y1="254" x2="544" y2="282" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arr-purple)"/>

  <!-- Namespace box (Purple) -->
  <rect x="228" y="284" width="432" height="222" rx="12" fill="#26215C" stroke="#7F77DD" stroke-width="1"/>
  <text x="444" y="306" text-anchor="middle" fill="#AFA9EC" font-weight="700" font-size="13">Namespace: gpu-workloads</text>

  <!-- GPU Job (Purple inner) -->
  <rect x="244" y="318" width="186" height="54" rx="8" fill="#3C3489" stroke="#7F77DD" stroke-width="1"/>
  <text x="337" y="340" text-anchor="middle" fill="#CECBF6" font-weight="600" font-size="12">GPU Job / Pod</text>
  <text x="337" y="359" text-anchor="middle" fill="#AFA9EC" font-size="11">requests: nvidia.com/gpu</text>

  <!-- Deployment (Purple inner) -->
  <rect x="458" y="318" width="186" height="54" rx="8" fill="#3C3489" stroke="#7F77DD" stroke-width="1"/>
  <text x="551" y="340" text-anchor="middle" fill="#CECBF6" font-weight="600" font-size="12">Deployment</text>
  <text x="551" y="359" text-anchor="middle" fill="#AFA9EC" font-size="11">Inference / training server</text>

  <!-- ConfigMap (Purple inner) -->
  <rect x="244" y="392" width="186" height="44" rx="8" fill="#3C3489" stroke="#7F77DD" stroke-width="1"/>
  <text x="337" y="410" text-anchor="middle" fill="#CECBF6" font-weight="600" font-size="12">ConfigMap / Secret</text>
  <text x="337" y="428" text-anchor="middle" fill="#AFA9EC" font-size="11">Env vars, model paths</text>

  <!-- PVC (Purple inner) -->
  <rect x="458" y="392" width="186" height="44" rx="8" fill="#3C3489" stroke="#7F77DD" stroke-width="1"/>
  <text x="551" y="410" text-anchor="middle" fill="#CECBF6" font-weight="600" font-size="12">PersistentVolumeClaim</text>
  <text x="551" y="428" text-anchor="middle" fill="#AFA9EC" font-size="11">Model weights storage</text>

  <!-- Monitoring row (Coral) -->
  <rect x="228" y="528" width="186" height="54" rx="8" fill="#4A1B0C" stroke="#993C1D" stroke-width="1"/>
  <text x="321" y="550" text-anchor="middle" fill="#F5C4B3" font-weight="600" font-size="12">DCGM Exporter</text>
  <text x="321" y="569" text-anchor="middle" fill="#993C1D" font-size="11">GPU metrics (Prometheus)</text>

  <rect x="444" y="528" width="196" height="54" rx="8" fill="#4A1B0C" stroke="#993C1D" stroke-width="1"/>
  <text x="542" y="550" text-anchor="middle" fill="#F5C4B3" font-weight="600" font-size="12">Prometheus + Grafana</text>
  <text x="542" y="569" text-anchor="middle" fill="#993C1D" font-size="11">Dashboards &amp; alerts</text>

  <!-- Arrow DCGM → Prometheus -->
  <line x1="414" y1="555" x2="442" y2="555" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arr-coral)"/>

  <!-- Left side label: Taints & Tolerations -->
  <text x="24" y="148" fill="#5F5E5A" font-size="11">Node Taints</text>
  <text x="24" y="162" fill="#5F5E5A" font-size="11">&amp; Tolerations</text>
  <line x1="100" y1="155" x2="208" y2="150" stroke="#444441" stroke-width="0.8" stroke-dasharray="4 3"/>

  <!-- Left side label: Helm/kubectl -->
  <text x="24" y="350" fill="#5F5E5A" font-size="11">Helm /</text>
  <text x="24" y="364" fill="#5F5E5A" font-size="11">kubectl</text>
  <line x1="72" y1="357" x2="208" y2="357" stroke="#444441" stroke-width="1" marker-end="url(#arr-gray)"/>

  <!-- Arrow markers -->
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#993C1D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>
